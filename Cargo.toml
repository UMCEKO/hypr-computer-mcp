[package]
name = "hypr-computer-mcp"
version = "0.1.0"
edition = "2024"
description = "The Anthropic computer-use tool as an MCP server, on Hyprland"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
strip = true
